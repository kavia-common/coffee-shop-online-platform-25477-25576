<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home Screen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./common.css">
  <link rel="stylesheet" href="./home-screen-1-3.css">
</head>
<body>
  <main class="screen" role="main">
    <div class="root-frame">
      <!-- Find coffee shop header -->
      <h1 class="heading">Find a coffee shop<br>anywhere</h1>
      <p class="featured-heading">Featured coffee shops</p>

      <!-- User profile -->
      <div class="profile">
        <img src="figmaimages/figma_image_203_66.png" alt="Profile" class="profile-image">
      </div>

      <!-- Search section -->
      <div class="search-section">
        <div class="search-bar">
          <div class="search-icon">
            <img src="figmaimages/figma_image_205_205.png" alt="Search icon">
          </div>
          <span class="search-text">Search</span>
        </div>
        <div class="filter-btn">
          <img src="figmaimages/figma_image_205_120.png" alt="Filter">
        </div>
      </div>

      <!-- Featured coffee shops grid -->
      <div class="coffee-shops">
        <article class="coffee-card card-1">
          <div class="card-header">
            <img src="figmaimages/figma_image_203_72.png" alt="Coffee shop" class="shop-image">
            <div class="favorite-btn">
              <img src="figmaimages/figma_image_205_91.png" alt="Add to favorites">
            </div>
          </div>
          <div class="card-content">
            <h2>Home Coffee Roasters</h2>
            <div class="rating">
              <img src="figmaimages/figma_image_205_98.png" alt="Star" class="star-icon">
              <span>4.5 1,200 reviews</span>
            </div>
            <span class="distance">3.8 miles</span>
          </div>
        </article>

        <article class="coffee-card card-2">
          <div class="card-header">
            <img src="figmaimages/figma_image_203_73.png" alt="Coffee shop" class="shop-image">
            <div class="favorite-btn">
              <img src="figmaimages/figma_image_205_91.png" alt="Add to favorites">
            </div>
          </div>
          <div class="card-content">
            <h2>Haus Coffee</h2>
            <div class="rating">
              <img src="figmaimages/figma_image_205_98.png" alt="Star" class="star-icon">
              <span>4.4 429 reviews</span>
            </div>
            <span class="distance">2.5 miles</span>
          </div>
        </article>

        <article class="coffee-card card-3">
          <div class="card-header">
            <img src="figmaimages/figma_image_203_72.png" alt="Coffee shop" class="shop-image">
            <div class="favorite-btn">
              <img src="figmaimages/figma_image_205_91.png" alt="Add to favorites">
            </div>
          </div>
          <div class="card-content">
            <h2>Home Coffee Roasters</h2>
            <div class="rating">
              <img src="figmaimages/figma_image_205_98.png" alt="Star" class="star-icon">
              <span>4.5 1,200 reviews</span>
            </div>
            <span class="distance">3.8 miles</span>
          </div>
        </article>

        <article class="coffee-card card-4">
          <div class="card-header">
            <img src="figmaimages/figma_image_203_73.png" alt="Coffee shop" class="shop-image">
            <div class="favorite-btn">
              <img src="figmaimages/figma_image_205_91.png" alt="Add to favorites">
            </div>
          </div>
          <div class="card-content">
            <h2>Haus Coffee</h2>
            <div class="rating">
              <img src="figmaimages/figma_image_205_98.png" alt="Star" class="star-icon">
              <span>4.4 429 reviews</span>
            </div>
            <span class="distance">2.5 miles</span>
          </div>
        </article>
      </div>

      <!-- Navigation -->
      <nav class="navigation">
        <div class="nav-item active">
          <div class="nav-highlight">
            <img src="figmaimages/figma_image_205_165.png" alt="Home active">
          </div>
          <div class="nav-icon">
            <img src="figmaimages/figma_image_205_154.png" alt="Home">
          </div>
        </div>
        <div class="nav-item">
          <div class="nav-icon">
            <img src="figmaimages/figma_image_205_162.png" alt="Favorites">
          </div>
        </div>
        <div class="nav-item">
          <div class="nav-icon">
            <img src="figmaimages/figma_image_205_157.png" alt="Bookmarks">
          </div>
        </div>
        <div class="nav-item">
          <div class="nav-icon">
            <img src="figmaimages/figma_image_205_160.png" alt="Profile">
          </div>
        </div>
      </nav>
    </div>
  </main>

  <script src="./app.js"></script>
  <script src="./home-screen-1-3.js"></script>
</body>
</html>
